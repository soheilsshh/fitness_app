ssl_key_file: "/var/www/live/privateKey.pem"

# CORS Configuration
allowed_origins:
  - "http://localhost:5173"
  - "https://live.fitinoo.ir"
  - "http://localhost:8080"
  - "http://localhost:3000"
  - "http://localhost:8096"

