# Backend configuration for Fitino Live Webinar

db_host: localhost
db_port: 3306
db_user: fitino_live
db_password: L1ve-Fitino-Webinar-2026
db_name: fitino_live
server_port: "8096"

# melipayamak/faraz_sms are vestigial — SendPatternSMS now goes through
# Kavenegar (see kavenegar: below) regardless of what's set here. Left in
# place only because the admin panel still has settings screens for them;
# safe to delete both the config here and those screens later.
melipayamak:
  username: "989103946748"
  api_key: ""
  body_id_welcome: 395320
  body_id_welcome_next_day: 0  # Disabled (pattern 395323 removed)
  body_id_reminder_2pm: 395349
  body_id_reminder_30min: 0  # Disabled - no longer used
  enabled: true

faraz_sms:
  api_key: ""  # API Key for Faraz SMS (IPPanel Edge)
  from_number: "+98PRO"  # Sender phone number in E.164 format (e.g., +983000505)
  enabled: true  # Enable/disable Faraz SMS service

# avanak = voice calls with a prerecorded audio file (message_id). Kavenegar
# has no equivalent for playing a specific prerecorded file, so this is
# NOT migrated — still calling Avanak directly, untouched, until a real
# replacement is sourced (see TODO.md).
avanak:
  token: "23568A4E750C3C8849CDCABFC2A5B4AB9241C864"
  message_id: 49170751  # کد فایل صوتی
  base_url: "https://portal.avanak.ir/Rest/QuickSend"  # Official QuickSend API endpoint
  enabled: true

# Kavenegar Verify Lookup — every SendPatternSMS call (webinar reminders,
# license codes, admin-authored messages) resolves its numeric pattern
# code through this map to a template name. A code with no entry here
# fails loudly (logged + error returned) instead of silently doing
# nothing, so a newly-added admin message type is easy to notice.
kavenegar:
  api_key: "SET-ME-REAL-KAVENEGAR-API-KEY"
  templates:
    "395320": "fitino-live-welcome"          # webinar registration welcome SMS
    "395349": "fitino-live-reminder-2pm"     # 2pm-day-of reminder
    "403249": "fitino-live-license-code"     # license/access code delivery (token=name, token2=code)
    "404962": "fitino-live-program-ready"    # "your program is ready" task message (token=name, token2=phone)

telegram:
  bot_token: ""  # Telegram Bot Token
  webhook_url: "https://live.fitinoo.ir/webhook/telegram"  # Webhook URL (optional - can be set via API)
  api_key: "0741a71b70336bf3d956cac3ac7f1582bbdc7a2fa661420a8e86c620c50f3e46"  # API Key for bot to authenticate with backend
  enabled: true  # Enable/disable Telegram Bot

groq:
  api_key: ""  # Groq API Key for AI chat
  model: "llama-3.3-70b-versatile"  # Groq model name
  enabled: true  # Enable/disable Groq AI

# HTTPS Configuration — nginx terminates TLS in front of this app, same as
# every other Fitino/Quantino site on this server, so this stays false.
enable_https: false
ssl_cert_file: "/var/www/live/fullchain.pem"
ssl_key_file: "/var/www/live/privateKey.pem"

# CORS Configuration
allowed_origins:
  - "http://localhost:5173"
  - "https://live.fitinoo.ir"
  - "http://localhost:8080"
  - "http://localhost:3000"
  - "http://localhost:8096"

# Webinar Schedule Configuration (Iran/Tehran timezone)
webinar:
  start_hour: 19    # ساعت شروع (0-23)
  start_minute: 0  # دقیقه شروع (0-59)
  end_hour: 22      # ساعت پایان (0-23)
  duration_minutes: 123  # مدت زمان وبینار به دقیقه (اختیاری - برای نمایش)

# Test Mode Configuration (برای تست - بعد از تست false کنید)
test_mode:
  enabled: false  # فعال/غیرفعال کردن حالت تست
  test_phone: "09155520952"  # شماره تست - فقط برای این شماره reminder یک دقیقه بعد از ثبت‌نام ارسال می‌شود

# Payment Configuration (ZarinPal) — callback lives on a rapexa.ir subdomain,
# same pattern as Fitinoo/Joftinoo's payment callbacks on this server.
payment:
  merchant_id: "fcbfe898-c7bf-4bee-9ac4-e37e79f730f5"  # همون مرچنت فیتینو/جفتینو
  sandbox: false
  callback_url: "https://live.rapexa.ir/payment/callback"  # URL callback
  frontend_url: "https://live.fitinoo.ir"  # Frontend base URL برای redirect
  subscription_price: 4900000   # 4,900,000 تومان