# Production Backend configuration for MonetizeAI Webinar

db_host: localhost
db_port: 3306
db_user: monetizeai_user_live
db_password: StrongPassword123!
db_name: monetizeai
server_port: "8081"

# HTTPS Configuration (for production)
enable_https: true
ssl_cert_file: "/etc/letsencrypt/live/sianmarketing.com/fullchain.pem"
ssl_key_file: "/etc/letsencrypt/live/sianmarketing.com/privkey.pem"

# CORS Configuration
allowed_origins:
  - "https://live.sianmarketing.com"
  - "https://sianmarketing.com"

# Groq AI Configuration
# api_key stays empty in git — GitHub push protection blocks Groq keys.
# Set GROQ_API_KEY in the server environment, or fill locally and do not commit.
groq:
  api_key: ""
  model: "llama-3.3-70b-versatile"
  enabled: true
