[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shenava-asr"
version = "1.0.0"
description = "Persian offline ASR (Shenava Koochik) for Fitino — sherpa-onnx + ITN"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "sherpa-onnx>=1.10.0",
  "soundfile>=0.12.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
download = ["huggingface_hub>=0.23.0"]

[project.scripts]
shenava-transcribe = "shenava_asr.cli:main"
shenava-download-model = "shenava_asr.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shenava_asr = ["py.typed"]
